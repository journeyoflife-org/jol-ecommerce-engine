name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        env:
          PYTHONPATH: backend
        run: mypy backend/ --show-error-codes

      - name: Security scan (bandit)
        run: bandit -r backend/jol_commerce -c pyproject.toml

      - name: Test with coverage
        env:
          PYTHONPATH: backend
        run: pytest tests/ -v --cov=backend/jol_commerce --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Detect secrets
        run: detect-secrets scan --baseline .secrets.baseline

      - name: Check dependency vulnerabilities
        # PYSEC-2026-1325: ecdsa 0.19.2 has no upstream fix; tracked as accepted risk
        run: pip-audit --ignore-vuln PYSEC-2026-1325

      - name: Verify no PAN patterns in code
        run: bash scripts/verify-no-pan-in-logs.sh --code-only
