name: Compliance Check

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/jol_commerce/payments/**"
      - "backend/jol_commerce/audit/**"
      - "backend/jol_commerce/tax/**"
      - "frontend/src/payment/**"
      - "compliance/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  compliance-check:
    name: PCI DSS & Compliance Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check no raw card data fields in payment module
        run: |
          echo "Checking for raw card data fields in payments module..."
          if grep -rn "card_number\|card_cvv\|card_cvc\|card_expiry\|pan_raw" backend/jol_commerce/payments/ --include="*.py"; then
            echo "CRITICAL: Raw card data fields detected in payments module!"
            echo "This violates PCI DSS SAQ A scope. Card data must stay within Stripe Elements/Checkout."
            exit 1
          fi
          echo "PASS: No raw card data fields found."

      - name: Check audit log fields are present in payment events
        run: |
          echo "Verifying audit log integration in payment and order modules..."
          if ! grep -rn "audit_log\|transaction_log\|AuditLogger" backend/jol_commerce/payments/ backend/jol_commerce/orders/ --include="*.py"; then
            echo "WARNING: No audit logging detected in payment/order modules."
            echo "PCI DSS Req. 10 requires logging of all payment events."
            exit 1
          fi
          echo "PASS: Audit logging references found."

      - name: Verify VAT rates are current
        run: |
          echo "Verifying Baltic VAT rates in country_rates.py..."
          python -c "
          import ast, sys
          with open('backend/jol_commerce/tax/country_rates.py') as f:
              content = f.read()
          if '0.21' not in content:
              print('FAIL: LT/LV rate 21% not found')
              sys.exit(1)
          if '0.24' not in content:
              print('FAIL: EE rate 24% (from 2025-07-01) not found')
              sys.exit(1)
          print('PASS: Baltic VAT rates verified.')
          "

      - name: Run security tests
        run: pytest tests/security/ -v

      - name: Run VAT tests
        run: pytest tests/tax/ -v

      - name: Comment on PR with compliance summary
        if: always()
uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Compliance Check Complete\n\nReview the [CI logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\n- [ ] PCI DSS SAQ A scope maintained\n- [ ] Audit logging present in payment/order flows\n- [ ] VAT rates verified (LT=21%, LV=21%, EE=24%)\n- [ ] Security tests passing\n- [ ] Security team co-approval obtained (CODEOWNERS)'
            })
