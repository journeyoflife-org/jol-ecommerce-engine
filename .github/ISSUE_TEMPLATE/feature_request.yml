name: Feature Request
description: Request a new feature for the JOL Commerce Engine
title: "[FEATURE] "
labels: ["enhancement"]
assignees:
  - journeyoflife-org/platform-core

body:
  - type: markdown
    attributes:
      value: |
        Please describe the feature you'd like to see added.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.

  - type: dropdown
    id: pci-impact
    attributes:
      label: PCI DSS Impact
      description: Does this feature touch payment flows or cardholder data?
      options:
        - "No PCI impact"
        - "Touches payment flows (SAQ A scope review needed)"
        - "Processes cardholder data (full PCI assessment needed)"
    validations:
      required: true

  - type: dropdown
    id: gdpr-impact
    attributes:
      label: GDPR Impact
      description: Does this feature involve processing personal data?
      options:
        - "No personal data processing"
        - "Processes existing personal data under Art. 6(1)(b)"
        - "New personal data processing — requires DPIA"
    validations:
      required: true
