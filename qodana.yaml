# Qodana — JetBrains code quality analysis
# https://www.jetbrains.com/qodana/

version: "1.0"
profile:
  name: qodana.recommended

include:
  - name: CheckDependencyLicenses
  - name: VulnerableLibraries

exclude:
  - name: All
    paths:
      - .venv
      - node_modules
      - tests
  # Qodana's bundled Python SDK cannot resolve third-party types from project
  # dependencies (stripe, pydantic, etc.), causing false-positive "Invalid type
  # annotation" errors on valid PEP 604 union syntax (X | None). Type correctness
  # is enforced by mypy --strict in pre-commit hooks instead.
  - name: PyTypeHintsInspection

linter: jetbrains/qodana-python:latest
